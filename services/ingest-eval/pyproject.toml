[project]
name = "coursemind-ingest-eval"
version = "0.0.0"
description = "CourseMind ingestion + evaluation service (parse, chunk, embed, score)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymupdf>=1.24",          # PDF parsing (SDD §4.3)
  "python-pptx>=1.0",       # slide parsing
  "google-generativeai>=0.8", # text-embedding-004 (ADR-0002 §2)
  "psycopg[binary]>=3.2",   # Postgres + pgvector
  "tenacity>=9.0",          # retry/backoff for free-tier quota (NFR-5)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursemind_ingest"]
