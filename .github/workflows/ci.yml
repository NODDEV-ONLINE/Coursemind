# CourseMind CI — M2 Task E5. Enforces "nothing merges red" (CLAUDE.md §5, NFR-11).
# Two parallel jobs (TS + Python). Tests are fully mocked — no DB/network/service
# containers here, so the pipeline stays fast.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable Corepack so the pnpm version pinned in package.json's
      # "packageManager" field is used (no separate version to keep in sync).
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 20 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  python:
    name: Python (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-eval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest-eval/pyproject.toml

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
