<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low data and privacy settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#090E19;color:#F4F5F6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#CEC7FB}a:hover{color:#F4F5F6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #090E19; color: #F4F5F6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">
  <header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2D304F;">
    <button type="button" aria-label="Back to chat" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F5F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600;">Settings</h1>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #979EA9;">Data</h2>
      <div style="display: flex; flex-direction: column; background: #12172A; border: 1px solid #2D304F; border-radius: 14px;">
        <label style="padding: 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2D304F;">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-weight: 600;">Low-data mode</span>
            <span style="font-size: 13px; line-height: 1.4; color: #979EA9;">Text-only answers under 30 KB. Page images load only when you tap.</span>
          </span>
          <input type="checkbox" role="switch" checked="checked" aria-checked="true" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
          <span aria-hidden="true" style="flex-shrink: 0; width: 48px; height: 28px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: #6C51F7; display: flex; justify-content: flex-end;">
            <span style="width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF;"></span>
          </span>
        </label>
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span style="font-size: 14px; color: #979EA9;">This session</span>
            <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;">~38 KB</span>
          </div>
          <div role="img" aria-label="Answers 24 kilobytes, sources 3 kilobytes, app 11 kilobytes" style="height: 8px; display: flex; gap: 2px; border-radius: 999px; overflow: hidden; background: #262A45;">
            <span style="width: 63%; background: #9B85F9;"></span>
            <span style="width: 8%; background: #CEC7FB;"></span>
            <span style="width: 29%; background: #4A30C6;"></span>
          </div>
          <div style="display: flex; gap: 14px; font-size: 12px; color: #979EA9;">
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #9B85F9;"></span>Answers 24 KB</span>
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #CEC7FB;"></span>Sources 3 KB</span>
            <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #4A30C6;"></span>App 11 KB</span>
          </div>
          <span style="font-size: 12px; color: #979EA9;">A typical answer is about 3 KB. The app itself is cached after the first visit.</span>
        </div>
      </div>
      <button type="button" style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: #12172A; border: 1px solid #2D304F; border-radius: 14px; color: #F4F5F6; font-size: 15px; font-family: inherit; text-align: left;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CEC7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M12 7v7M9 11l3 3 3-3"></path></svg>
        <span style="flex-grow: 1;">Add to home screen</span>
        <span style="font-size: 12px; color: #979EA9;">Works offline</span>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #979EA9;">Privacy</h2>
      <div style="display: flex; flex-direction: column; background: #12172A; border: 1px solid #2D304F; border-radius: 14px; font-size: 14px;">
        <div style="padding: 12px 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2D304F;"><span style="color: #979EA9;">Your ID</span><span style="font-weight: 600;">anon-7F3K</span></div>
        <div style="padding: 12px 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2D304F;"><span style="color: #979EA9;">Consent</span><span>Given 29 Sep 2026 · v1</span></div>
        <div style="padding: 12px 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2D304F;"><span style="color: #979EA9;">Questions kept for</span><span>90 days</span></div>
        <a href="#privacy" style="padding: 12px 14px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">Read the privacy notice <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CEC7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      </div>
      <button type="button" style="min-height: 48px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid rgba(239, 68, 68, 0.55); border-radius: 14px; color: #FCA5A5; font-size: 15px; font-weight: 600; font-family: inherit; text-align: left;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          Delete my data
          <span style="font-size: 12px; font-weight: 400; color: #979EA9;">Erases your questions, ratings and flags. Can't be undone.</span>
        </span>
      </button>
    </section>
  </main>
</div>
</x-dc>

</html>
